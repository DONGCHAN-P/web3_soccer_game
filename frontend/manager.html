<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>⚽ Soccer Manager</title>
<style>
/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0c0f1a;color:#d4dce8;min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;font-family:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100vh}
nav{background:#070b14;border-bottom:1px solid #1a2e4a;display:flex;align-items:center;padding:0 20px;gap:4px;flex-shrink:0;height:48px}
nav .logo{color:#4fc3f7;font-weight:800;font-size:1rem;margin-right:16px;letter-spacing:-0.5px}
nav .tab{padding:0 16px;height:48px;display:flex;align-items:center;font-size:0.82rem;color:#6b8cae;border-bottom:2px solid transparent;transition:all .15s}
nav .tab:hover{color:#9ab}
nav .tab.active{color:#4fc3f7;border-bottom-color:#4fc3f7}
.page{display:none;flex:1;overflow:hidden}
.page.active{display:flex}

/* ── SQUAD PAGE ── */
#squadPage{gap:0}
.squad-left{width:380px;flex-shrink:0;border-right:1px solid #1a2e4a;display:flex;flex-direction:column;overflow:hidden}
.squad-header{padding:16px 18px;border-bottom:1px solid #1a2e4a;display:flex;justify-content:space-between;align-items:center}
.squad-header h2{font-size:0.9rem;color:#4fc3f7}
.squad-header input{background:#111827;border:1px solid #1a2e4a;color:#d4dce8;padding:5px 10px;border-radius:6px;font-size:0.82rem;width:130px}
.squad-toolbar{padding:10px 18px;border-bottom:1px solid #1a2e4a;display:flex;gap:8px}
.btn-sm{padding:5px 12px;border-radius:6px;font-size:0.75rem;font-weight:600;background:#1a2e4a;color:#9ab;transition:background .15s}
.btn-sm:hover{background:#243d5c}
.btn-primary-sm{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff}
.btn-primary-sm:hover{background:linear-gradient(135deg,#1976d2,#1565c0)}
.player-list{overflow-y:auto;flex:1}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid #0f1a2a;transition:background .1s;cursor:pointer}
.player-row:hover{background:#111827}
.player-row.selected{background:#142035;border-left:3px solid #4fc3f7}
.pos-badge{width:36px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:0.68rem;font-weight:700;flex-shrink:0}
.player-info{flex:1;min-width:0}
.player-name{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-nat{font-size:0.68rem;color:#6b8cae}
.player-rating{font-size:0.9rem;font-weight:700;color:#4fc3f7;flex-shrink:0}
.tier-badge{font-size:0.6rem;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0}

.squad-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.pitch-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0}
.pitch{width:340px;height:480px;background:linear-gradient(180deg,#1a4a1a,#143d14);border:2px solid #2d6b2d;border-radius:8px;position:relative;overflow:hidden;flex-shrink:0}
/* pitch markings */
.pitch::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border:1px solid rgba(255,255,255,0.15);border-radius:50%}
.pitch::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.12)}
.pitch-zone{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,0.07)}

.player-dot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.player-dot .dot-inner{width:38px;height:38px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;border:2px solid rgba(255,255,255,0.25);transition:all .2s;line-height:1.2}
.player-dot:hover .dot-inner{transform:scale(1.15);border-color:rgba(255,255,255,0.6)}
.player-dot .dot-pos{font-size:0.58rem;color:rgba(255,255,255,0.7)}
.player-dot .dot-rat{font-size:0.72rem;color:#fff;font-weight:800}

.player-detail{padding:20px;border-top:1px solid #1a2e4a;max-height:200px;overflow-y:auto;background:#080c18}
.player-detail h3{font-size:0.85rem;color:#4fc3f7;margin-bottom:12px}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ds{background:#111827;border-radius:5px;padding:5px 8px;text-align:center}
.ds .dv{font-size:0.88rem;font-weight:700;color:#e0e6f0}
.ds .dk{font-size:0.6rem;color:#6b8cae;margin-top:1px}

/* ── MATCH PAGE ── */
#matchPage{flex-direction:column}
.match-header{background:#070b14;border-bottom:1px solid #1a2e4a;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.match-header h2{font-size:0.9rem;color:#4fc3f7}
.match-header .spacer{flex:1}
.scoreboard{display:flex;align-items:center;gap:0;background:#111827;border:1px solid #1a2e4a;border-radius:10px;overflow:hidden;flex-shrink:0}
.sb-team{padding:12px 20px;text-align:center;min-width:140px}
.sb-team .name{font-size:0.75rem;color:#6b8cae;margin-bottom:4px}
.sb-team .ov{font-size:0.7rem;color:#4fc3f7}
.sb-score{padding:10px 24px;font-size:2.2rem;font-weight:900;color:#fff;letter-spacing:6px;border-left:1px solid #1a2e4a;border-right:1px solid #1a2e4a;min-width:100px;text-align:center}
.match-status{font-size:0.72rem;padding:3px 10px;border-radius:10px;font-weight:600}
.match-status.idle{background:#1a2e4a;color:#6b8cae}
.match-status.live{background:#c62828;color:#fff;animation:blink 1s infinite}
.match-status.done{background:#1b5e20;color:#a5d6a7}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

.match-body{flex:1;display:flex;overflow:hidden}
.match-left{width:320px;flex-shrink:0;border-right:1px solid #1a2e4a;display:flex;flex-direction:column}
.match-left-header{padding:12px 16px;border-bottom:1px solid #1a2e4a;font-size:0.78rem;color:#6b8cae;text-transform:uppercase;letter-spacing:1px}
.events-feed{flex:1;overflow-y:auto;padding:10px 0}
.event-item{display:flex;align-items:flex-start;gap:10px;padding:7px 16px;border-bottom:1px solid #0a1020;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.event-item .ev-min{width:30px;font-size:0.68rem;color:#6b8cae;padding-top:2px;flex-shrink:0}
.event-item .ev-desc{font-size:0.78rem;line-height:1.4}
.ev-goal .ev-desc{color:#64b5f6;font-weight:600}
.ev-save .ev-desc{color:#80cbc4}
.ev-miss .ev-desc{color:#546e7a}
.ev-tackle .ev-desc{color:#546e7a}

.match-center{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* mini pitch */
.mini-pitch-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-height:0}
.mini-pitch{width:260px;height:360px;background:linear-gradient(180deg,#1a4a1a,#143d14);border:2px solid #2d6b2d;border-radius:6px;position:relative}
.mini-pitch::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border:1px solid rgba(255,255,255,0.15);border-radius:50%}
.mini-pitch::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.12)}
.ball{position:absolute;width:14px;height:14px;background:radial-gradient(circle at 35% 35%,#fff,#ccc);border-radius:50%;transform:translate(-50%,-50%);transition:all .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(255,255,255,0.4);z-index:3}

.match-stats-bottom{padding:16px 20px;border-top:1px solid #1a2e4a;background:#080c18}
.stat-compare{display:flex;flex-direction:column;gap:8px}
.sc-row{display:flex;align-items:center;gap:8px;font-size:0.72rem}
.sc-val{width:28px;text-align:center;color:#9ab;font-weight:600}
.sc-label{width:70px;text-align:center;color:#6b8cae;font-size:0.68rem}
.sc-bar-wrap{flex:1;height:5px;background:#1a2e4a;border-radius:3px;overflow:hidden;position:relative}
.sc-bar-h{position:absolute;right:50%;top:0;height:100%;background:#1976d2;border-radius:3px;transition:width .5s}
.sc-bar-a{position:absolute;left:50%;top:0;height:100%;background:#c62828;border-radius:3px;transition:width .5s}
.poss-track-wrap{display:flex;align-items:center;gap:8px;font-size:0.72rem;padding-top:8px;border-top:1px solid #1a2e4a;margin-top:4px}
.poss-track-bg{flex:1;height:8px;background:#1a2e4a;border-radius:4px;overflow:hidden;position:relative}
.poss-h{position:absolute;left:0;top:0;height:100%;background:#1976d2;border-radius:4px;transition:width .5s}
.poss-a{position:absolute;right:0;top:0;height:100%;background:#c62828;border-radius:4px;transition:width .5s}
.poss-mid{position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(90deg,#1976d2,#c62828)}
.match-right{width:200px;flex-shrink:0;border-left:1px solid #1a2e4a;display:flex;flex-direction:column;overflow:hidden}
.match-right-header{padding:12px 16px;border-bottom:1px solid #1a2e4a;font-size:0.78rem;color:#6b8cae;text-transform:uppercase;letter-spacing:1px}
.match-lineup{overflow-y:auto;flex:1;padding:8px 0}
.lineup-row{padding:5px 14px;font-size:0.72rem;display:flex;gap:6px;align-items:center;border-bottom:1px solid #0a1020}
.lineup-row .lpos{color:#4fc3f7;width:32px;flex-shrink:0;font-weight:700}
.lineup-row .lrat{color:#6b8cae;margin-left:auto}

/* ── Match controls ── */
.match-controls{padding:14px 24px;border-top:1px solid #1a2e4a;display:flex;gap:10px;align-items:center;background:#080c18;flex-shrink:0}
.btn-kick{background:linear-gradient(135deg,#c62828,#b71c1c);color:#fff;padding:10px 24px;border-radius:8px;font-weight:700;font-size:0.88rem}
.btn-kick:hover{background:linear-gradient(135deg,#d32f2f,#c62828)}
.btn-kick:disabled{background:#1a2e4a;color:#546e7a;cursor:not-allowed}
.speed-group{display:flex;gap:4px;margin-left:8px}
.speed-btn{background:#1a2e4a;color:#6b8cae;padding:5px 10px;border-radius:5px;font-size:0.72rem}
.speed-btn.active{background:#243d5c;color:#4fc3f7;font-weight:700}
.progress-bar-wrap{flex:1;background:#1a2e4a;border-radius:4px;height:6px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,#1976d2,#4fc3f7);border-radius:4px;transition:width .3s}
.minute-label{font-size:0.72rem;color:#6b8cae;min-width:36px;text-align:right}

/* ── Colors ── */
.c-gk{background:#7b1fa2;color:#fff}
.c-def{background:#1565c0;color:#fff}
.c-mid{background:#2e7d32;color:#fff}
.c-atk{background:#bf360c;color:#fff}
.t-N{background:#1a2e4a;color:#9ab}
.t-S{background:#1a3a1a;color:#81c784}
.t-R{background:#1a1a3a;color:#90caf9}
.t-W{background:#2a1a00;color:#ffcc02}
.t-G{background:#2a0a0a;color:#f48fb1}
</style>
</head>
<body>
<div id="app">
  <nav>
    <div class="logo">⚽ SoccerManager</div>
    <button class="tab active" onclick="showPage('squad')">스쿼드</button>
    <button class="tab" onclick="showPage('match')">경기</button>
    <div style="flex:1"></div>
    <span id="navTeamName" style="font-size:0.78rem;color:#6b8cae"></span>
  </nav>

  <!-- ══ SQUAD PAGE ══ -->
  <div class="page active" id="squadPage">
    <div class="squad-left">
      <div class="squad-header">
        <h2>스쿼드</h2>
        <input id="teamNameInput" placeholder="팀 이름" value="Alpha FC" oninput="updateTeamName()"/>
      </div>
      <div class="squad-toolbar">
        <button class="btn-sm" onclick="regenSquad()">🎲 재생성</button>
        <button class="btn-sm btn-primary-sm" onclick="showPage('match')">▶ 경기하기</button>
      </div>
      <div class="player-list" id="playerList"></div>
    </div>
    <div class="squad-right">
      <div class="pitch-wrap">
        <div class="pitch" id="pitchEl"></div>
      </div>
      <div class="player-detail" id="playerDetail">
        <div style="color:#546e7a;font-size:0.8rem;text-align:center;padding:10px">선수를 클릭하면 스탯을 볼 수 있어요</div>
      </div>
    </div>
  </div>

  <!-- ══ MATCH PAGE ══ -->
  <div class="page" id="matchPage">
    <div class="match-header">
      <h2 id="matchTitle">경기 준비</h2>
      <div class="scoreboard">
        <div class="sb-team">
          <div class="name" id="sbHomeName">—</div>
          <div class="ov" id="sbHomeOv"></div>
        </div>
        <div class="sb-score" id="sbScore">0 : 0</div>
        <div class="sb-team">
          <div class="name" id="sbAwayName">—</div>
          <div class="ov" id="sbAwayOv"></div>
        </div>
      </div>
      <span class="match-status idle" id="matchStatus">대기</span>
      <div class="spacer"></div>
    </div>

    <div class="match-body">
      <!-- Events feed -->
      <div class="match-left">
        <div class="match-left-header">경기 이벤트</div>
        <div class="events-feed" id="eventsFeed">
          <div style="padding:20px;color:#546e7a;font-size:0.78rem;text-align:center">경기를 시작하면 이벤트가 여기에 나타납니다</div>
        </div>
      </div>

      <!-- Pitch + stats -->
      <div class="match-center">
        <div class="mini-pitch-wrap">
          <div class="mini-pitch" id="miniPitch">
            <div class="ball" id="ball" style="left:50%;top:50%"></div>
          </div>
        </div>
        <div class="match-stats-bottom">
          <div class="stat-compare" id="statCompare">
            <div class="sc-row">
              <div class="sc-val" id="scShotsH">0</div>
              <div class="sc-bar-wrap"><div class="sc-bar-h" id="barShotsH" style="width:0"></div><div class="sc-bar-a" id="barShotsA" style="width:0"></div></div>
              <div class="sc-val" id="scShotsA">0</div>
              <div class="sc-label">슈팅</div>
            </div>
            <div class="sc-row">
              <div class="sc-val" id="scOnH">0</div>
              <div class="sc-bar-wrap"><div class="sc-bar-h" id="barOnH" style="width:0"></div><div class="sc-bar-a" id="barOnA" style="width:0"></div></div>
              <div class="sc-val" id="scOnA">0</div>
              <div class="sc-label">유효슈팅</div>
            </div>
          </div>
          <div class="poss-track-wrap">
            <span id="possH" style="color:#4169e1;font-weight:700">50%</span>
            <div class="poss-track-bg">
              <div class="poss-mid"></div>
              <div class="poss-h" id="possBarH" style="width:50%"></div>
              <div class="poss-a" id="possBarA" style="width:50%;left:auto;right:0"></div>
            </div>
            <span id="possA" style="color:#c62828;font-weight:700">50%</span>
          </div>
        </div>
      </div>

      <!-- Lineup -->
      <div class="match-right">
        <div class="match-right-header">라인업</div>
        <div class="match-lineup" id="matchLineup"></div>
      </div>
    </div>

    <div class="match-controls">
      <button class="btn-kick" id="kickoffBtn" onclick="startMatch()">⚽ 킥오프</button>
      <div class="speed-group">
        <button class="speed-btn active" onclick="setSpeed(1,this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(3,this)">3×</button>
        <button class="speed-btn" onclick="setSpeed(10,this)">10×</button>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressBar" style="width:0"></div></div>
      <div class="minute-label" id="minuteLabel">0'</div>
    </div>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────
const PHASES=30;
const FORMATION=['GK','CB','CB','RB','LB','CDM','CM','CM','RW','LW','ST'];
const POS_MAIN={GK:['반사 신경','다이빙','핸들링','1대1 방어'],CB:['태클','헤딩','인터셉트','힘'],RB:['속도','태클','크로스','스태미너'],LB:['속도','태클','크로스','스태미너'],CDM:['태클','인터셉트','경기 지능','위치 선정'],CM:['패스','경기 지능','퍼스트 터치','위치 선정'],CAM:['패스','드리블','공간 침투','공격 성향'],RW:['속도','드리블','크로스','민첩성'],LW:['속도','드리블','크로스','민첩성'],ST:['슛 정확도','헤딩','공간 침투','균형 감각']};
const POS_SEC={GK:['킥 능력','반응 속도','펀칭'],CB:['침착함','균형감각','패스'],RB:['인터셉트','드리블','민첩성'],LB:['인터셉트','드리블','민첩성'],CDM:['팀워크','수비 성향','스태미너'],CM:['킥 능력','공간 침투','체력 회복력'],CAM:['슛 정확도','크로스','위치 선정'],RW:['슛 정확도','퍼스트 터치','가속력'],LW:['슛 정확도','퍼스트 터치','가속력'],ST:['가속도','공격 성향','위치 선정']};
const ALL_ATTRS=['1대1 방어','가속력','가속도','경기 지능','공간 침투','공격 성향','균형 감각','균형감각','다이빙','드리블','리더십','민첩성','반사 신경','반응 속도','수비 성향','스태미너','슛 정확도','위치 선정','인터셉트','체력 회복력','침착함','크로스','킥 능력','태클','팀워크','패스','펀칭','퍼스트 터치','핸들링','헤딩','헝가리','힘','속도','점프력'];

function rng(){return Math.random()}
function ri(a,b){return Math.floor(rng()*(b-a+1))+a}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function nr(m,s){let u=0,v=0;while(!u)u=rng();while(!v)v=rng();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

const NATIONS=['Argentina','France','Brazil','England','Spain','Germany','Portugal','Italy','Netherlands','Belgium','Croatia','Japan','South Korea','Mexico','Morocco','USA','Colombia','Uruguay','Denmark','Sweden','Poland','Switzerland','Chile','Turkey','Serbia','Australia','Egypt','Nigeria','Iran','Senegal'];
function randNation(rating){
  const idx=Math.min(Math.floor(rating/100*NATIONS.length),NATIONS.length-1);
  return NATIONS[Math.floor(rng()*(idx+1))];
}

let playerIdSeq=1;
function genPlayer(pos){
  const main=POS_MAIN[pos]||[],sec=POS_SEC[pos]||[];
  const stats={},mv=[],sv=[];
  for(const a of ALL_ATTRS){
    let v;
    if(main.includes(a)){v=Math.round(clamp(nr(70,30),38,99));mv.push(v);}
    else if(sec.includes(a)){v=Math.round(clamp(nr(60,20),35,90));sv.push(v);}
    else{v=Math.round(clamp(nr(35,20),1,80));}
    stats[a]=v;
  }
  const avgM=mv.length?mv.reduce((a,b)=>a+b,0)/mv.length*0.7:0;
  const avgS=sv.length?sv.reduce((a,b)=>a+b,0)/sv.length*0.3:0;
  const rating=Math.round((avgM+avgS)*10)/10;
  const tier=rating<60?'N':rating<70?'S':rating<80?'R':rating<90?'W':'G';
  return{id:playerIdSeq++,pos,stats,rating,tier,nation:randNation(rating),name:`P${playerIdSeq}`};
}

function genSquad(){return FORMATION.map(pos=>genPlayer(pos))}

function avgStats(players,attrs){
  const v=players.flatMap(p=>attrs.map(a=>p.stats[a]??40));
  return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:50;
}

function overall(players){return Math.round(players.reduce((a,p)=>a+p.rating,0)/players.length*10)/10}

// ── Position layout on pitch (x%,y%) ─────────────────────────────────────
const POS_XY={
  GK: {x:50,y:90},
  LB: {x:18,y:72}, CB0:{x:37,y:75}, CB1:{x:63,y:75}, RB:{x:82,y:72},
  CDM:{x:50,y:58},
  CM0:{x:30,y:48}, CM1:{x:70,y:48},
  LW: {x:15,y:28}, RW:{x:85,y:28}, ST:{x:50,y:18},
};
function posXY(pos,posCount){
  const k=pos;
  if(k==='CB')return posCount===0?POS_XY.CB0:POS_XY.CB1;
  if(k==='CM')return posCount===0?POS_XY.CM0:POS_XY.CM1;
  return POS_XY[k]||{x:50,y:50};
}
function posCounts(){return {CB:0,CM:0}}

// ── Colors ────────────────────────────────────────────────────────────────
function posColor(pos){
  if(pos==='GK')return['#7b1fa2','#ce93d8'];
  if(['CB','RB','LB'].includes(pos))return['#1565c0','#90caf9'];
  if(['CDM','CM','CAM'].includes(pos))return['#2e7d32','#a5d6a7'];
  return['#bf360c','#ffcc80'];
}
function tierColor(t){return{N:'#9ab',S:'#81c784',R:'#90caf9',W:'#ffcc02',G:'#f48fb1'}[t]||'#9ab'}
function posClass(pos){
  if(pos==='GK')return 'c-gk';
  if(['CB','RB','LB'].includes(pos))return 'c-def';
  if(['CDM','CM','CAM'].includes(pos))return 'c-mid';
  return 'c-atk';
}

// ── State ─────────────────────────────────────────────────────────────────
let mySquad=null,enemySquad=null,selectedPlayer=null,matchRunning=false,matchSpeed=1;

function regenSquad(){mySquad=genSquad();enemySquad=genSquad();renderSquad();renderMatchPage();}
function updateTeamName(){document.getElementById('navTeamName').textContent=document.getElementById('teamNameInput').value}

// ── Render Squad ──────────────────────────────────────────────────────────
function renderSquad(){
  if(!mySquad)return;
  const list=document.getElementById('playerList');
  const cbCnt={CB:0,CM:0};
  list.innerHTML=mySquad.map((p,i)=>{
    const posKey=p.pos+(p.pos==='CB'||p.pos==='CM'?cbCnt[p.pos]++:'');
    const [bg]=posColor(p.pos);
    return`<div class="player-row" onclick="selectPlayer(${i})" id="prow_${i}">
      <div class="pos-badge ${posClass(p.pos)}">${p.pos}</div>
      <div class="player-info"><div class="player-name">선수 #${p.id}</div><div class="player-nat">${p.nation}</div></div>
      <div class="tier-badge t-${p.tier}">${p.tier}</div>
      <div class="player-rating">${p.rating}</div>
    </div>`;
  }).join('');
  renderPitch();
}

function renderPitch(){
  const pitch=document.getElementById('pitchEl');
  const cnt={CB:0,CM:0};
  pitch.innerHTML=mySquad.map((p,i)=>{
    const c=cnt[p.pos]||0;
    if(p.pos==='CB'||p.pos==='CM')cnt[p.pos]=(cnt[p.pos]||0)+1;
    const xy=posXY(p.pos,c);
    const [bg,text]=posColor(p.pos);
    return`<div class="player-dot" style="left:${xy.x}%;top:${xy.y}%" onclick="selectPlayer(${i})">
      <div class="dot-inner" style="background:${bg}">
        <div class="dot-pos">${p.pos}</div>
        <div class="dot-rat">${p.rating}</div>
      </div>
    </div>`;
  }).join('');
}

function selectPlayer(i){
  selectedPlayer=i;
  document.querySelectorAll('.player-row').forEach((r,j)=>r.classList.toggle('selected',j===i));
  const p=mySquad[i];
  const mainAttrs=POS_MAIN[p.pos]||[];
  const keyStats=[...mainAttrs,...(POS_SEC[p.pos]||[])].slice(0,9);
  document.getElementById('playerDetail').innerHTML=`
    <h3>선수 #${p.id} &nbsp;<span style="color:#6b8cae;font-weight:400;font-size:0.72rem">${p.pos} · ${p.nation}</span>&nbsp;<span class="tier-badge t-${p.tier}" style="font-size:0.65rem">${p.tier}</span></h3>
    <div class="detail-stats">${keyStats.map(a=>`<div class="ds"><div class="dv">${p.stats[a]??'—'}</div><div class="dk">${a}</div></div>`).join('')}</div>
  `;
}

// ── Render Match Page header ──────────────────────────────────────────────
function renderMatchPage(){
  if(!mySquad||!enemySquad)return;
  const hn=document.getElementById('teamNameInput').value||'My Team';
  const an='Rival FC';
  document.getElementById('sbHomeName').textContent=hn;
  document.getElementById('sbAwayName').textContent=an;
  document.getElementById('sbHomeOv').textContent='OVR '+overall(mySquad);
  document.getElementById('sbAwayOv').textContent='OVR '+overall(enemySquad);
  document.getElementById('sbScore').textContent='0 : 0';
  document.getElementById('matchTitle').textContent=`${hn} vs ${an}`;

  // lineup
  const lu=document.getElementById('matchLineup');
  lu.innerHTML=mySquad.map(p=>`
    <div class="lineup-row">
      <span class="lpos">${p.pos}</span>
      <span>#${p.id}</span>
      <span class="lrat">${p.rating}</span>
    </div>`).join('');
}

// ── Match simulation ──────────────────────────────────────────────────────
let matchTimer=null;
function setSpeed(s,btn){
  matchSpeed=s;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function startMatch(){
  if(matchRunning)return;
  if(!mySquad)regenSquad();
  const hn=document.getElementById('teamNameInput').value||'My Team';

  document.getElementById('kickoffBtn').disabled=true;
  document.getElementById('eventsFeed').innerHTML='<div style="color:#6b8cae;padding:8px 16px">경기 시뮬레이션 중...</div>';
  document.getElementById('sbScore').textContent='0 : 0';
  document.getElementById('progressBar').style.width='0';
  document.getElementById('minuteLabel').textContent="0'";
  document.getElementById('matchStatus').className='match-status live';
  document.getElementById('matchStatus').textContent='LIVE';

  let raw;
  try{
    const res=await fetch('http://localhost:8000/match/simulate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        home_team_name:hn,
        away_team_name:'Rival FC',
        home_players:mySquad.map(p=>({
          id:p.id,name:p.name||`Player_${p.id}`,
          position:p.pos,nationality:p.nation||'Unknown',
          rating:p.rating,tier:p.tier,stats:p.stats
        }))
      })
    });
    if(!res.ok)throw new Error(`API ${res.status}`);
    raw=await res.json();
  }catch(e){
    document.getElementById('eventsFeed').innerHTML=
      `<div style="color:#ef5350;padding:8px 16px">서버 연결 실패: ${e.message}<br><small>백엔드 실행: cd backend && uvicorn api.main:app --reload</small></div>`;
    document.getElementById('kickoffBtn').disabled=false;
    return;
  }

  // API 응답을 기존 렌더링 코드가 기대하는 형식으로 정규화
  const result={
    hs0:raw.home_score,
    as0:raw.away_score,
    hPoss:Math.round(raw.home_possession),
    events:raw.events.map(e=>({min:e.minute,type:e.type,side:e.team,desc:e.description}))
  };

  // reset stats
  ['H','A'].forEach(s=>['Shots','On'].forEach(k=>{
    document.getElementById(`sc${k}${s}`).textContent='0';
    document.getElementById(`bar${k}${s}`).style.width='0';
  }));
  document.getElementById('possH').textContent='50%';
  document.getElementById('possA').textContent='50%';
  document.getElementById('possBarH').style.width='50%';
  document.getElementById('possBarA').style.width='50%';

  matchRunning=true;
  let idx=0,hScore=0,aScore=0,hSh=0,aSh=0,hOn=0,aOn=0,hPossC=0;
  const allEvents=result.events;

  // group events by phase min
  function tick(){
    if(idx>=allEvents.length){
      finishMatch(result,hn);return;
    }
    const ev=allEvents[idx++];
    const min=ev.min;
    const progress=Math.min(min/90*100,100);
    document.getElementById('progressBar').style.width=progress+'%';
    document.getElementById('minuteLabel').textContent=min+"'";

    // ball position
    moveBall(ev.side,ev.type,min);

    // update stats
    if(ev.type==='goal'){
      if(ev.side==='home'){hScore++;hOn++;hSh++;}else{aScore++;aOn++;aSh++;}
      document.getElementById('sbScore').textContent=`${hScore} : ${aScore}`;
    }
    if(ev.type==='save'){if(ev.side==='home'){hOn++;hSh++;}else{aOn++;aSh++;}}
    if(ev.type==='miss'){if(ev.side==='home')hSh++;else aSh++;}

    if(hSh+aSh>0){
      const tot=hSh+aSh;
      document.getElementById('scShotsH').textContent=hSh;
      document.getElementById('scShotsA').textContent=aSh;
      document.getElementById('barShotsH').style.width=(hSh/tot*45)+'%';
      document.getElementById('barShotsA').style.width=(aSh/tot*45)+'%';
    }
    if(hOn+aOn>0){
      const tot=hOn+aOn;
      document.getElementById('scOnH').textContent=hOn;
      document.getElementById('scOnA').textContent=aOn;
      document.getElementById('barOnH').style.width=(hOn/tot*45)+'%';
      document.getElementById('barOnA').style.width=(aOn/tot*45)+'%';
    }
    // rough possession from events
    if(ev.side==='home')hPossC++;
    const hp=Math.round(hPossC/idx*100);
    document.getElementById('possH').textContent=hp+'%';
    document.getElementById('possA').textContent=(100-hp)+'%';
    document.getElementById('possBarH').style.width=hp+'%';
    document.getElementById('possBarA').style.width=(100-hp)+'%';

    // add event to feed
    const feed=document.getElementById('eventsFeed');
    const div=document.createElement('div');
    div.className=`event-item ev-${ev.type}`;
    div.innerHTML=`<span class="ev-min">${min}'</span><span class="ev-desc">${ev.desc}</span>`;
    feed.insertBefore(div,feed.firstChild);

    const delay=ev.type==='goal'?1200/matchSpeed:ev.type==='save'?600/matchSpeed:300/matchSpeed;
    matchTimer=setTimeout(tick,delay);
  }
  tick();
}

function moveBall(side,type,min){
  const ball=document.getElementById('ball');
  let x,y;
  if(type==='goal'){x=side==='home'?ri(40,60):ri(40,60);y=side==='home'?ri(5,15):ri(85,95);}
  else if(type==='save'){x=ri(35,65);y=side==='home'?ri(10,20):ri(80,90);}
  else if(type==='miss'){x=ri(30,70);y=side==='home'?ri(15,30):ri(70,85);}
  else if(type==='tackle'){x=ri(25,75);y=side==='home'?ri(35,55):ri(45,65);}
  else{x=ri(35,65);y=ri(35,65);}
  ball.style.left=x+'%';
  ball.style.top=y+'%';
}

function finishMatch(result,hn){
  matchRunning=false;
  document.getElementById('kickoffBtn').disabled=false;
  document.getElementById('progressBar').style.width='100%';
  document.getElementById('minuteLabel').textContent="90'";
  const st=document.getElementById('matchStatus');
  st.className='match-status done';
  const hs=result.hs0,as=result.as0;
  st.textContent=hs>as?`${hn} 승!`:hs<as?'Rival FC 승!':'무승부';
  document.getElementById('sbScore').textContent=`${hs} : ${as}`;
  // final poss
  document.getElementById('possH').textContent=result.hPoss+'%';
  document.getElementById('possA').textContent=(100-result.hPoss)+'%';
  document.getElementById('possBarH').style.width=result.hPoss+'%';
  document.getElementById('possBarA').style.width=(100-result.hPoss)+'%';
  // add FT marker
  const feed=document.getElementById('eventsFeed');
  const div=document.createElement('div');
  div.style.cssText='padding:8px 16px;font-size:0.72rem;color:#4fc3f7;font-weight:700;border-bottom:1px solid #1a2e4a';
  div.textContent=`🏁 경기 종료 — ${hs} : ${as}`;
  feed.insertBefore(div,feed.firstChild);
  // regen enemy for next match
  enemySquad=genSquad();
}

// ── Page navigation ───────────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id+'Page').classList.add('active');
  document.querySelectorAll('.tab')[id==='squad'?0:1].classList.add('active');
  if(id==='match')renderMatchPage();
}

// ── Init ──────────────────────────────────────────────────────────────────
regenSquad();
document.getElementById('navTeamName').textContent=document.getElementById('teamNameInput').value;
</script>
