<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>⚽ Web3 Soccer Manager — Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0e1a; color: #e0e6f0; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a2744, #0d1b35); padding: 20px 32px; border-bottom: 1px solid #1e3a5f; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.4rem; font-weight: 700; color: #4fc3f7; }
  header span { font-size: 0.8rem; color: #6b8cae; background: #1e3a5f; padding: 2px 10px; border-radius: 20px; }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

  .teams-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; margin-bottom: 24px; }

  .team-card { background: #111827; border: 1px solid #1e3a5f; border-radius: 12px; padding: 20px; }
  .team-card h2 { font-size: 1rem; color: #4fc3f7; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .team-card h2 input { background: #1a2744; border: 1px solid #2a4a6e; color: #e0e6f0; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; width: 140px; }

  .stat-bars { display: flex; flex-direction: column; gap: 7px; }
  .stat-row { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; }
  .stat-label { width: 68px; color: #6b8cae; text-align: right; flex-shrink: 0; }
  .stat-bar-bg { flex: 1; height: 6px; background: #1e3a5f; border-radius: 3px; overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .stat-val { width: 28px; text-align: right; font-size: 0.75rem; color: #9ab; }

  .vs-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-top: 16px; }
  .score-box { background: #0d1b35; border: 2px solid #1e3a5f; border-radius: 12px; padding: 14px 22px; text-align: center; min-width: 110px; }
  .score-box .score { font-size: 2.4rem; font-weight: 800; color: #fff; letter-spacing: 4px; }
  .score-box .label { font-size: 0.7rem; color: #4fc3f7; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

  .btn { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; padding: 10px 22px; transition: all 0.15s; }
  .btn-primary { background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; }
  .btn-primary:hover { background: linear-gradient(135deg, #1976d2, #1565c0); transform: translateY(-1px); }
  .btn-secondary { background: #1e3a5f; color: #4fc3f7; font-size: 0.8rem; padding: 7px 14px; }
  .btn-secondary:hover { background: #2a4a6e; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  .mini-stat { background: #0d1b35; border-radius: 8px; padding: 10px 14px; text-align: center; }
  .mini-stat .val { font-size: 1.3rem; font-weight: 700; color: #e0e6f0; }
  .mini-stat .lbl { font-size: 0.7rem; color: #6b8cae; margin-top: 2px; }

  .poss-bar { background: #0d1b35; border-radius: 8px; padding: 12px 14px; margin-bottom: 24px; }
  .poss-bar .lbl-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #6b8cae; margin-bottom: 6px; }
  .poss-track { height: 8px; background: #1e3a5f; border-radius: 4px; overflow: hidden; }
  .poss-fill { height: 100%; background: linear-gradient(90deg, #1976d2, #42a5f5); border-radius: 4px; transition: width 0.6s; }

  .timeline { background: #111827; border: 1px solid #1e3a5f; border-radius: 12px; padding: 20px; }
  .timeline h3 { font-size: 0.85rem; color: #6b8cae; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .events-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
  .events-list::-webkit-scrollbar { width: 4px; } .events-list::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }

  .event { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 0.82rem; }
  .event.goal { background: rgba(25, 118, 210, 0.15); border-left: 3px solid #1976d2; }
  .event.save { background: rgba(0, 150, 136, 0.12); border-left: 3px solid #00897b; }
  .event.miss { background: rgba(255,255,255,0.03); border-left: 3px solid #37474f; color: #546e7a; }
  .event.tackle { background: rgba(255,255,255,0.03); border-left: 3px solid #37474f; color: #546e7a; }
  .event .min { width: 34px; font-size: 0.7rem; color: #6b8cae; flex-shrink: 0; }
  .event .desc { flex: 1; }

  .overall-badge { font-size: 0.75rem; background: #1e3a5f; padding: 2px 8px; border-radius: 10px; color: #4fc3f7; }
  .players-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 12px; }
  .player-chip { background: #0d1b35; border-radius: 6px; padding: 5px 8px; font-size: 0.7rem; }
  .player-chip .pos { color: #4fc3f7; font-weight: 700; margin-right: 4px; }
  .player-chip .rat { float: right; color: #9ab; }

  .empty-state { text-align: center; padding: 40px; color: #6b8cae; font-size: 0.9rem; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 10px; }

  .strengths { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .str-item { font-size: 0.72rem; color: #6b8cae; display: flex; justify-content: space-between; }
  .str-item span { color: #9ab; }
</style>
</head>
<body>

<header>
  <span>⚽</span>
  <h1>Web3 Soccer Manager</h1>
  <span>Demo v0.1</span>
</header>

<main>
  <div class="teams-row">
    <!-- HOME TEAM -->
    <div class="team-card" id="homeCard">
      <h2>🏠 홈팀 <input id="homeName" value="Alpha FC" /></h2>
      <div id="homeStrengths" class="stat-bars"></div>
      <div id="homePlayers" class="players-grid" style="margin-top:12px"></div>
      <button class="btn btn-secondary" style="margin-top:12px;width:100%" onclick="genTeam('home')">🎲 팀 재생성</button>
    </div>

    <!-- CENTER -->
    <div class="vs-col">
      <div class="score-box" id="scoreBox">
        <div class="score" id="scoreText">— : —</div>
        <div class="label" id="scoreLabel">대기 중</div>
      </div>
      <button class="btn btn-primary" onclick="runMatch()">▶ 경기 시작</button>
      <div style="font-size:0.7rem;color:#6b8cae;text-align:center">또는</div>
      <button class="btn btn-secondary" onclick="genBothAndMatch()">🎲 랜덤 경기</button>
    </div>

    <!-- AWAY TEAM -->
    <div class="team-card" id="awayCard">
      <h2>✈️ 원정팀 <input id="awayName" value="Beta FC" /></h2>
      <div id="awayStrengths" class="stat-bars"></div>
      <div id="awayPlayers" class="players-grid" style="margin-top:12px"></div>
      <button class="btn btn-secondary" style="margin-top:12px;width:100%" onclick="genTeam('away')">🎲 팀 재생성</button>
    </div>
  </div>

  <!-- MATCH STATS -->
  <div id="matchStats" style="display:none;margin-bottom:24px">
    <div class="stats-row">
      <div class="mini-stat"><div class="val" id="statShotsH">—</div><div class="lbl">홈 슈팅 (유효)</div></div>
      <div class="mini-stat"><div class="val" id="statShotsA">—</div><div class="lbl">원정 슈팅 (유효)</div></div>
    </div>
    <div class="poss-bar" style="margin-top:10px">
      <div class="lbl-row"><span id="possLabelH">홈 0%</span><span>점유율</span><span id="possLabelA">원정 0%</span></div>
      <div class="poss-track"><div class="poss-fill" id="possBar" style="width:50%"></div></div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline">
    <h3>📋 경기 이벤트</h3>
    <div class="events-list" id="eventsList">
      <div class="empty-state"><div class="icon">🏟️</div>경기 시작 버튼을 눌러보세요</div>
    </div>
  </div>
</main>

<script>
// ─── 상수 ───────────────────────────────────────────────────────────────────
const PHASES = 30;
const POSS_SCALE = 0.06;
const CHANCE_SCALE = 0.05;
const MAX_CHANCE_PROB = 0.72;
const SHOOT_WEIGHT = 0.005, SHOOT_BASE = 0.25;
const GK_WEIGHT = 0.007, GK_BASE = 0.20;

const POSITIONS_4_3_3 = ['GK','CB','CB','RB','LB','CDM','CM','CM','RW','LW','ST'];

const POS_MAIN = {
  GK:  ['반사 신경','다이빙','핸들링','1대1 방어'],
  CB:  ['태클','헤딩','인터셉트','힘'],
  RB:  ['속도','태클','크로스','스태미너'],
  LB:  ['속도','태클','크로스','스태미너'],
  CDM: ['태클','인터셉트','경기 지능','위치 선정'],
  CM:  ['패스','경기 지능','퍼스트 터치','위치 선정'],
  CAM: ['패스','드리블','공간 침투','공격 성향'],
  RW:  ['속도','드리블','크로스','민첩성'],
  LW:  ['속도','드리블','크로스','민첩성'],
  ST:  ['슛 정확도','헤딩','공간 침투','균형 감각'],
};
const POS_SEC = {
  GK:  ['킥 능력','반응 속도','펀칭'],
  CB:  ['침착함','균형감각','패스'],
  RB:  ['인터셉트','드리블','민첩성'],
  LB:  ['인터셉트','드리블','민첩성'],
  CDM: ['팀워크','수비 성향','스태미너'],
  CM:  ['킥 능력','공간 침투','체력 회복력'],
  CAM: ['슛 정확도','크로스','위치 선정'],
  RW:  ['슛 정확도','퍼스트 터치','가속력'],
  LW:  ['슛 정확도','퍼스트 터치','가속력'],
  ST:  ['가속도','공격 성향','위치 선정'],
};

const GK_STATS   = ['반사 신경','다이빙','핸들링','1대1 방어'];
const DEF_STATS  = ['태클','인터셉트','헤딩','힘','위치 선정'];
const MID_STATS  = ['패스','경기 지능','위치 선정','퍼스트 터치','스태미너'];
const ATK_STATS  = ['드리블','속도','공간 침투','민첩성','가속력'];
const SHOOT_STATS = ['슛 정확도','공격 성향'];

// ─── 유틸 ───────────────────────────────────────────────────────────────────
function rand() { return Math.random(); }
function randInt(a, b) { return Math.floor(rand() * (b - a + 1)) + a; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function normalRand(mean, std) {
  // Box-Muller
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function sigmoid(diff, scale) {
  const raw = 1 / (1 + Math.exp(-diff * scale));
  return 0.2 + raw * 0.6;
}
function statToProb(stat, weight, base, lo = 0.20, hi = 0.85) {
  return clamp(stat * weight + base, lo, hi);
}

// ─── 선수 생성 ───────────────────────────────────────────────────────────────
function generatePlayer(id, pos) {
  const main = POS_MAIN[pos] || [];
  const sec  = POS_SEC[pos]  || [];
  const stats = {};
  const mainVals = [], secVals = [];

  const allAttrs = new Set([...Object.values(POS_MAIN).flat(), ...Object.values(POS_SEC).flat(),
    '태클','속도','위치 선정','1대1 방어','민첩성','반사 신경','펀칭','수비 성향','다이빙','인터셉트',
    '크로스','슛 정확도','가속력','팀워크','스태미너','드리블','균형감각','공간 침투','리더십','패스',
    '킥 능력','침착함','헤딩','경기 지능','핸들링','점프력','공격 성향','퍼스트 터치','반응 속도','힘']);

  for (const attr of allAttrs) {
    let v;
    if (main.includes(attr)) {
      v = Math.round(clamp(normalRand(70, 30), 38, 99));
      mainVals.push(v);
    } else if (sec.includes(attr)) {
      v = Math.round(clamp(normalRand(60, 20), 35, 90));
      secVals.push(v);
    } else {
      v = Math.round(clamp(normalRand(35, 20), 1, 80));
    }
    stats[attr] = v;
  }
  const avgMain = mainVals.length ? mainVals.reduce((a,b)=>a+b,0)/mainVals.length * 0.7 : 0;
  const avgSec  = secVals.length  ? secVals.reduce((a,b)=>a+b,0)/secVals.length  * 0.3 : 0;
  const rating  = Math.round((avgMain + avgSec) * 10) / 10;
  return { id, pos, stats, rating };
}

function generateSquad(startId = 0) {
  return POSITIONS_4_3_3.map((pos, i) => generatePlayer(startId + i, pos));
}

// ─── 팀 강점 계산 ────────────────────────────────────────────────────────────
function avgStats(players, attrs) {
  const vals = players.flatMap(p => attrs.map(a => p.stats[a] ?? 40));
  return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10 : 50;
}

function getStrengths(players) {
  const gk  = players.filter(p => p.pos === 'GK');
  const def = players.filter(p => ['CB','RB','LB'].includes(p.pos));
  const mid = players.filter(p => ['CDM','CM','CAM'].includes(p.pos));
  const atk = players.filter(p => ['RW','LW','ST'].includes(p.pos));
  return {
    goalkeeping: avgStats(gk, GK_STATS),
    defense:     avgStats(def, DEF_STATS),
    midfield:    avgStats(mid, MID_STATS),
    attack:      avgStats(atk, ATK_STATS),
    shooting:    avgStats([...atk, ...mid], SHOOT_STATS),
  };
}

function overallRating(players) {
  return Math.round(players.reduce((a,p)=>a+p.rating,0)/players.length * 10)/10;
}

// ─── 경기 시뮬레이션 ──────────────────────────────────────────────────────────
function simulateMatch(homePlayers, awayPlayers, homeName, awayName) {
  const hStr = getStrengths(homePlayers);
  const aStr = getStrengths(awayPlayers);

  const events = [];
  let hScore=0, aScore=0, hShots=0, aShots=0, hOn=0, aOn=0, hPoss=0;

  for (let phase = 0; phase < PHASES; phase++) {
    const minute = phase * 3 + randInt(1, 3);

    // 1. 점유
    const hPossProb = sigmoid(hStr.midfield - aStr.midfield, POSS_SCALE);
    let atkStr, defStr, atkName, defName, side;
    if (rand() < hPossProb) {
      atkStr=hStr; defStr=aStr; atkName=homeName; defName=awayName; side='home'; hPoss++;
    } else {
      atkStr=aStr; defStr=hStr; atkName=awayName; defName=homeName; side='away';
    }

    // 2. 기회 창출
    const atkPow = atkStr.attack * 0.65 + atkStr.midfield * 0.35;
    const defPow = defStr.defense * 0.75 + defStr.midfield * 0.25;
    let chanceProb = Math.min(sigmoid(atkPow - defPow, CHANCE_SCALE), MAX_CHANCE_PROB);

    if (rand() > chanceProb) {
      if (rand() < 0.3) events.push({ minute, type:'tackle', desc:`🛡️ ${minute}' ${defName} 수비 차단` });
      continue;
    }
    if (side==='home') hShots++; else aShots++;

    // 3. 유효슈팅
    const shootProb = statToProb(atkStr.shooting, SHOOT_WEIGHT, SHOOT_BASE, 0.30, 0.70);
    if (rand() > shootProb) {
      events.push({ minute, type:'miss', desc:`💨 ${minute}' ${atkName} 슈팅 빗나감` });
      continue;
    }
    if (side==='home') hOn++; else aOn++;

    // 4. 골
    const gkProb = statToProb(defStr.goalkeeping, GK_WEIGHT, GK_BASE, 0.50, 0.80);
    if (rand() > gkProb) {
      if (side==='home') hScore++; else aScore++;
      events.push({ minute, type:'goal', desc:`⚽ ${minute}' ${atkName} 골! (${hScore}-${aScore})` });
    } else {
      events.push({ minute, type:'save', desc:`🧤 ${minute}' ${defName} 골키퍼 선방!` });
    }
  }

  return {
    hScore, aScore, hShots, aShots, hOn, aOn,
    hPoss: Math.round(hPoss / PHASES * 100),
    events, hStr, aStr
  };
}

// ─── 상태 ───────────────────────────────────────────────────────────────────
let homeTeam = null, awayTeam = null;

function genTeam(side) {
  const offset = side === 'home' ? 0 : 100;
  const players = generateSquad(offset);
  if (side === 'home') homeTeam = players; else awayTeam = players;
  renderTeam(side, players);
}

function genBothAndMatch() {
  genTeam('home'); genTeam('away'); runMatch();
}

// ─── 렌더링 ─────────────────────────────────────────────────────────────────
const STR_COLORS = {
  goalkeeping: '#ffb74d', defense: '#4dd0e1', midfield: '#81c784', attack: '#f06292', shooting: '#ce93d8'
};
const STR_LABELS = { goalkeeping:'골키핑', defense:'수비', midfield:'미드', attack:'공격', shooting:'슈팅' };

function renderTeam(side, players) {
  const str = getStrengths(players);
  const ov  = overallRating(players);
  const strEl = document.getElementById(side === 'home' ? 'homeStrengths' : 'awayStrengths');
  const plEl  = document.getElementById(side === 'home' ? 'homePlayers'   : 'awayPlayers');
  const nameEl = document.getElementById(side === 'home' ? 'homeName' : 'awayName');

  // strengths
  strEl.innerHTML = `<div style="font-size:0.72rem;color:#6b8cae;margin-bottom:8px">오버롤 <span style="color:#4fc3f7;font-weight:700">${ov}</span></div>` +
    Object.entries(str).map(([k, v]) => `
      <div class="stat-row">
        <div class="stat-label">${STR_LABELS[k]}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${v}%;background:${STR_COLORS[k]}"></div></div>
        <div class="stat-val">${v}</div>
      </div>`).join('');

  // players
  plEl.innerHTML = players.map(p => `
    <div class="player-chip">
      <span class="pos">${p.pos}</span>${p.id % 1000}
      <span class="rat">${p.rating}</span>
    </div>`).join('');
}

function runMatch() {
  if (!homeTeam) genTeam('home');
  if (!awayTeam) genTeam('away');

  const homeName = document.getElementById('homeName').value || 'Home FC';
  const awayName = document.getElementById('awayName').value || 'Away FC';
  const res = simulateMatch(homeTeam, awayTeam, homeName, awayName);

  // score
  document.getElementById('scoreText').textContent = `${res.hScore} : ${res.aScore}`;
  let lbl = res.hScore > res.aScore ? `${homeName} 승` : res.hScore < res.aScore ? `${awayName} 승` : '무승부';
  document.getElementById('scoreLabel').textContent = lbl;

  // stats
  document.getElementById('matchStats').style.display = 'block';
  document.getElementById('statShotsH').textContent = `${res.hShots} (${res.hOn})`;
  document.getElementById('statShotsA').textContent = `${res.aShots} (${res.aOn})`;
  document.getElementById('possLabelH').textContent = `${homeName} ${res.hPoss}%`;
  document.getElementById('possLabelA').textContent = `${awayName} ${100-res.hPoss}%`;
  document.getElementById('possBar').style.width = res.hPoss + '%';

  // events
  const el = document.getElementById('eventsList');
  const filtered = res.events.filter(e => ['goal','save','miss','tackle'].includes(e.type));
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">😴</div>이벤트 없음</div>';
    return;
  }
  el.innerHTML = filtered.map(e => `
    <div class="event ${e.type}">
      <span class="min">${e.minute}'</span>
      <span class="desc">${e.desc}</span>
    </div>`).join('');
  el.scrollTop = 0;
}

// ─── 초기화 ─────────────────────────────────────────────────────────────────
genTeam('home');
genTeam('away');
</script>
</body>
</html>
